<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d9488">
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192.png">
    <link rel="apple-touch-icon" sizes="250x250" href="/apple-touch-icon-250.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png">
    <title>分帳記帳簿</title>
    <script>
      // Safari can paint the URL of the navigation before the ES module that
      // mounts React has downloaded.  Keep this tiny, synchronous bootstrap in
      // the document head so a reload of the bare entry URL is canonicalized
      // before the first page frame, rather than waiting for App.jsx to run.
      // This is deliberately limited to the account's previously verified own
      // book: explicit /g links and legacy shareId links may be shared books.
      (function canonicalizeOwnBookBeforeFirstPaint() {
        try {
          var url = new URL(window.location.href);
          var isBareRootRequest = !/\/g\/[^/?#]+/.test(url.pathname)
            && !url.searchParams.has('shareId');
          if (!isBareRootRequest) return;

          var cached = JSON.parse(
            window.localStorage.getItem('split-expense-auth-bootstrap-v1') || 'null'
          );
          if (!cached || typeof cached.uid !== 'string' || !cached.uid
            || typeof cached.ownShortCode !== 'string' || !cached.ownShortCode) return;

          url.pathname = '/g/' + encodeURIComponent(cached.ownShortCode);
          window.history.replaceState(null, '', url.toString());
        } catch (error) {
          // localStorage may be disabled; App.jsx retains a later safe fallback.
        }
      }());
    </script>
    <!-- Telegram WebApp SDK: defer 讓一般瀏覽器不會被卡 (only used when launched inside Telegram Mini App) -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
